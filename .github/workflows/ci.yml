name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Offline demo (no API keys)
        run: node apps/cli/dist/index.js demo --yes --no-color
      - name: Evaluation suite (mock provider)
        run: node apps/cli/dist/index.js eval run --no-color
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: eval-results
          path: eval-results/
